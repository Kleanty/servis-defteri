{% extends 'base.html' %}{% block content %}
<div class="mx-auto" style="max-width:32rem">
<h4 class="mb-2">📱 Bu cihaza ad ver</h4>
<p class="small-muted">Kayıtlarda “hangi cihaz yaptı” görünsün diye. Bu soru bu cihazda yalnızca bir kez sorulur. Aynı adı birden çok cihaza verebilirsin.</p>
<form method="post" action="{{url_for('cihaz_adi_kaydet')}}" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="geri" value="{{geri}}">
  <input class="form-control form-control-lg mb-2" id="cad" name="ad" maxlength="30" minlength="2" autofocus placeholder="Örn: Usta telefonu" aria-label="Cihaz adı">
  <div class="d-flex flex-wrap gap-2 mb-3">{% for o in ['Usta telefonu','Ofis bilgisayarı','Tezgâh'] %}<button type="button" class="btn btn-outline-secondary btn-sm cip" data-ad="{{o}}">{{o}}</button>{% endfor %}</div>
  <button class="btn btn-primary btn-lg w-100 fw-bold">Kaydet ve devam et</button>
</form></div>
<script>document.querySelectorAll('.cip').forEach(function(b){b.addEventListener('click',function(){var i=document.getElementById('cad');i.value=b.dataset.ad;i.focus();});});</script>
{% endblock %}

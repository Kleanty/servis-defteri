<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f3a"><link rel="icon" href="/static/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="48x48" href="/static/favicon-48.png"><link rel="icon" type="image/png" sizes="96x96" href="/static/favicon-96.png"><link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet"><title>Servis Girişi · {{isletme.ad}}</title>
<style>
:root{--bs-primary:#14325c;--bs-primary-rgb:20,50,92;--bs-link-color:#14325c;--bs-link-hover-color:#0b1f3a;--navy:#0b1f3a;--navy2:#14325c;--amber:#fbbf24}
body{background:#f1f5f9}
.btn-primary{--bs-btn-bg:#14325c;--bs-btn-border-color:#14325c;--bs-btn-hover-bg:#0b1f3a;--bs-btn-hover-border-color:#0b1f3a;--bs-btn-active-bg:#0b1f3a;--bs-btn-active-border-color:#0b1f3a;--bs-btn-disabled-bg:#14325c;--bs-btn-disabled-border-color:#14325c}
.btn-outline-primary{--bs-btn-color:#14325c;--bs-btn-border-color:#14325c;--bs-btn-hover-bg:#14325c;--bs-btn-hover-border-color:#14325c;--bs-btn-active-bg:#14325c;--bs-btn-active-border-color:#14325c}
.text-bg-primary{background-color:#14325c!important}
.btn-amber{--bs-btn-color:#1e1b0b;--bs-btn-bg:#fbbf24;--bs-btn-border-color:#fbbf24;--bs-btn-hover-color:#1e1b0b;--bs-btn-hover-bg:#f59e0b;--bs-btn-hover-border-color:#f59e0b;--bs-btn-active-color:#1e1b0b;--bs-btn-active-bg:#f59e0b;--bs-btn-active-border-color:#f59e0b;--bs-btn-disabled-color:#1e1b0b;--bs-btn-disabled-bg:#fbbf24;--bs-btn-disabled-border-color:#fbbf24}
.navbar{background:linear-gradient(160deg,#0b1f3a,#14325c)!important}
.marka-yazi{font-weight:800;letter-spacing:.16em;color:#fff;text-decoration:none;white-space:nowrap}.amb{color:#fbbf24}
.logo-chip{display:inline-flex;background:transparent;border-radius:0;padding:0}.logo-chip img{height:58px;width:auto;display:block}
.card{border-radius:16px;border-color:#e2e8f0}
body{min-height:100vh;background:linear-gradient(160deg,#0b1f3a,#14325c);display:flex;align-items:center}.marka-yazi{font-size:1.3rem}</style></head>
<body><div class="container" style="max-width:380px"><div class="text-center mb-4"><span class="marka-yazi">{% if logo %}<span class="logo-chip"><img src="{{logo}}" alt="{{isletme.ad}}"></span>{% else %}{{isletme.ad_html}}{% endif %}</span><div class="small mt-2" style="color:#94a3b8">Servis yetkilisi girişi</div></div>
<div class="card p-4 shadow-lg border-0">{% for c,m in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{c}} fw-semibold">⛔ {{m}}</div>{% endfor %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control form-control-lg mb-3" type="password" name="sifre" placeholder="Şifre" required autofocus autocomplete="current-password"><button class="btn btn-amber btn-lg w-100 fw-bold py-3">Giriş Yap</button></form>
<a class="btn btn-outline-secondary w-100 mt-3" href="{{url_for('anasayfa')}}">← Web sitesine dön</a></div></div></body></html>
